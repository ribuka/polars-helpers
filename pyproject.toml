[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-helpers"
dynamic = ["version"]
description = "Small helpers for polars DataFrames and LazyFrames."
readme = "README.md"
requires-python = ">=3.12"
# The lower bound is the oldest polars the CI `test-lowest` job tests;
# 1.18 is the first release whose join keeps the right order with
# maintain_order (1.17 added the parameter but ignores it for how="right").
dependencies = [
    "polars>=1.18",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\S+)\s*$'

[tool.hatch.build.targets.wheel]
packages = ["src/polars_helpers"]

[tool.uv]
# The version comes from VERSION, so a change to it reinstalls the package.
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "tmp"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "D", "ANN"]

# `**kwargs` passed through to polars are typed as `Any`.
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["src"]
