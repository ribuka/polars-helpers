[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-helpers"
dynamic = ["version"]
description = "Small helpers for polars DataFrames and LazyFrames."
readme = "README.md"
requires-python = ">=3.12"
# The lower bound is the oldest polars the CI `test-lowest` job tests;
# 2.0 is the first release whose streaming engine keeps the order of the
# right-only rows of a full join with maintain_order, which merge_on_disk
# relies on with buckets=1 (pl.PartitionBy, which it also needs, came in
# 1.37, but up to 1.44 the streaming full join loses that order).
dependencies = [
    "polars>=2.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\S+)\s*$'

[tool.hatch.build.targets.wheel]
packages = ["src/polars_helpers"]

[tool.uv]
# The version comes from VERSION, so a change to it reinstalls the package.
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "tmp"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["src"]
